<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어림확률 — 임신 위험</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f6f4; --line: #e2e2dd;
    --text: #16160f; --muted: #5f5f57; --accent: #7a5cff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1b1b19; --line: #2c2c28;
      --text: #f2f2ec; --muted: #9d9d94; --accent: #a894ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 4rem 1.25rem 5rem;
    background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  .eyebrow {
    font-size: .75rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 .5rem;
  }
  h1 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 .75rem; letter-spacing: -.02em; }
  .lede { color: var(--muted); margin: 0 0 2.5rem; }
  nav { display: grid; gap: .75rem; }
  nav a {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 1rem 1.25rem;
  }
  nav a strong { display: block; color: var(--accent); margin-bottom: .15rem; }
  nav a span { color: var(--muted); font-size: .9375rem; }
  footer a { color: var(--muted); }
  footer {
    margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
    color: var(--muted); font-size: .875rem;
  }
</style>
</head>
<body>
<main>

  <p class="eyebrow">iPhone 앱</p>
  <h1>어림확률</h1>
  <p class="lede">그녀의 주기와 타이밍에 관한 일곱 가지 질문에 답하면, 임신 확률
  추정치와 실제로 다음에 해야 할 일을 알 수 있습니다.
  모든 것은 iPhone에만 남습니다.</p>

  <nav>
    <a href="./support.ko.html">
      <strong>지원</strong>
      <span>자주 묻는 질문과 문의 방법입니다.</span>
    </a>
    <a href="./privacy.ko.html">
      <strong>개인정보 처리방침</strong>
      <span>짧습니다. 이 앱이 아무것도 수집하지 않기 때문입니다.</span>
    </a>
  </nav>

  <footer>
    <p>정보 제공 목적일 뿐입니다. 의학적 조언이 아닙니다.<br>
    확실히 알아야 한다면 검사하세요.</p>
    <p><a href="./index.html" hreflang="en">English</a> · <a href="./index.zh-Hans.html" hreflang="zh-Hans">简体中文</a> · <a href="./index.ja.html" hreflang="ja">日本語</a> · <a href="./index.es.html" hreflang="es">Español</a></p>
  </footer>

</main>
</body>
</html>
